<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>chat™ admin</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="admin-page">
        <h1>chat™</h1>
        <nav class="admin-nav">
          <div class="admin-nav-tabs">
            <a href="/admin" class="active">home</a>
            <a href="/admin/users">users</a>
            <a href="/admin/emoji">emoji</a>
          </div>
          <a href="/" class="admin-nav-back">← back to chat™</a>
        </nav>
        <div id="admin-actions-content">
          <button id="owner-mutechat-btn">toggle chat mute</button>
          <button id="owner-maintenance-btn">toggle maintenance</button>
          <button id="owner-clear-btn">clear channel history</button>
          <button id="owner-refresh-version-btn">refresh version status</button>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script>
          const session = localStorage.getItem('session')
          if (!session) window.location.href = "/"
          const socket = io(window.location.origin, {
            auth: { session },
            transports: ["websocket"]
          })

          let chatMutedb = false
          socket.on("init", ({ chatMuted }) => { chatMutedb = chatMuted })

          socket.on("connect", () => {
            socket.emit("getAdminUsers");
          });
          socket.on("adminUserlist", renderUsers);

          document.querySelector('#owner-mutechat-btn').addEventListener('click', async () => {
            try {
              const res = await fetch ('/admin/mutechat', {
                method: "POST",
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session }),
                });
              const data = await res.json();
              if (data.success) {
                chatMutedb = data.muted;
                // alert() is a placeholder like last time
                alert(data.muted ? 'chat muted' : 'chat unmuted')
              } else {
                alert('failed to toggle mute')
              }
            } catch (e) {
              alert('error: ' + e.message);
            }
          });

          document.querySelector('#owner-maintenance-btn').addEventListener('click', async () => {
            const reason = prompt('maintenance reason: (leave blank to turn off)');
            if (reason === null) return
            try {
              const res = await fetch('/admin/maintenance', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session, reason })
              });
              const data = await res.json();
              if (data.success) {
                alert(data.maintenance ? `maintenance on: ${data.reason}` : `maintenance disabled`)
              } else {
                alert('failed to toggle maintenance')
              }
            } catch (e) {
              alert('error: ' + e.message)
            }
          });

          // this only clears main for now, will implement like a channel picker/switcher eventually

          document.querySelector('#owner-clear-btn').addEventListener('click', async () => {
            if (!confirm('clear all chat history?')) return
            try {
              const res = await fetch('/admin/clear', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session, channel: 'main' })
              });
              const data = await res.json();
              if (data.success) {
                alert('chat cleared')
              } else {
                alert('failed to clear chat')
              }
            } catch (e) {
              alert('error: ' + e.message)
            }
          });

          document.querySelector('#owner-refresh-version-btn').addEventListener('click', async () => {
            await fetch('/version?refresh=1')
            // no feedback to end user here, i really don't want to use the browser prompt for this it's so annoying and the commandError/status functioanlity isn't present here
          })

          // no choice but to implement this as much as i hate browser prompts, if something calls commandError and there's no handler for it it could probably crash the entire site and i don't want that
          socket.on('commandError', (msg) => alert(msg))
        </script>
    </body>
</html>
