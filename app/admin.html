<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>chat™ admin</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    </head>
    <body class="admin-page">
        <h1>chat™</h1>
        <nav class="admin-nav">
          <div class="admin-nav-tabs">
            <a href="/admin" class="active">home</a>
            <a href="/admin/users">users</a>
            <a href="/admin/emoji">emoji</a>
          </div>
          <a href="/" class="admin-nav-back">← back to chat™</a>
        </nav>
        <div id="admin-actions-content">
            <div class="admin-section">
                <h3 class="admin-section-title">quick actions</h3>
                <div class="admin-actions-buttons">
                    <button id="owner-mutechat-btn"><i class='ti ti-microphone off'></i> toggle chat mute</button>
                    <button id="owner-maintenance-btn"><i class="ti ti-tool"></i> toggle maintenance</button>
                    <button id="owner-clear-btn"><i class="ti ti-trash"></i> clear channel history</button>
                    <button id="owner-refresh-version-btn"><i class="ti ti-refresh"></i> refresh version status</button>
                </div>
            </div>

            <div class="admin-section">
                <h3 class="admin-section-title">server stats</h3>
                <div id="admin-stats-grid" class="admin-stats-grid">
                    <div class="admin-loading">loading...</div>
                </div>
            </div>

            <div class="admin-section">
                <h3 class="admin-section-title">online now</h3>
                <div class="admin-online-users">
                    <div class="admin-online-count">
                        <span class="count" id="admin-online-count">-</span>
                        <span>users online</span>
                    </div>
                </div>
            </div>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script>
          const session = localStorage.getItem('session')
          if (!session) window.location.href = "/"
          const socket = io(window.location.origin, {
            auth: { session },
            transports: ["websocket"]
          })

          function showModal({ message, withInput = false, defaultValue = '' }) {
            return new Promise((resolve) => {
              const overlay = document.querySelector('#modal-overlay');
              const msgEl = document.querySelector('#modal-message');
              const inputEl = document.querySelector('#modal-input');
              const confirmBtn = document.querySelector('#modal-confirm')
              const cancelBtn = document.querySelector('#modal-cancel')

              msgEl.textContent = message;
              inputEl.style.display = withInput ? "block" : "none"
              inputEl.value = defaultValue
              overlay.style.display = "flex"
              if (withInput) inputEl.focus()

              function cleanUp(result) {
                overlay.style.display = "none";
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                if (withInput) inputEl.removeEventListener('keydown', onKey)
                resolve(result)
              }
              function onConfirm() {
                cleanUp(withInput ? inputEl.value : true)
              }
              function onCancel() {
                cleanUp(withInput ? null : false)
              }
              function onKey(e) {
                if (e.key === "Enter") {
                  e.preventDefault()
                  onConfirm()
                } else if (e.key === "Escape") {
                  e.preventDefault();
                  onCancel();
                }
              }
              confirmBtn.addEventListener('click', onConfirm)
              cancelBtn.addEventListener('click', onCancel)
              if (withInput) inputEl.addEventListener("keydown", onKey)
            })
          }

          function showToast(message, type = 'info') {
            const container = document.querySelector('#toast-container');
            const toast = document.createElement('div')
            toast.className = `toast ${type}`
            toast.textContent = message;
            container.appendChild(toast)

            setTimeout(() => {
              toast.style.opacity = '0'
              toast.style.transform = 'translateY(10px)';
              toast.style.transition = 'opacity 0.2s, transform 0.2s'
              setTimeout(() => toast.remove(), 200)
            }, 3000)
          }

          let chatMutedb = false
          socket.on("init", ({ chatMuted }) => { chatMutedb = chatMuted })

          async function loadStats() {
            try {
              const res = await fetch('/stats')
              const data = await res.json()

              function formatBytes(bytes) {
                if (bytes === 0) return '0 B'
                const k = 1024
                const sizes = ["B", "KB", "MB", "GB"]
                const i = Math.floor(Math.log(bytes) / Math.log(k))
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
              }

              const rows = [
                ['accounts', data.users.toLocaleString()],
                ['total messages', data.messages.toLocaleString()],
                ['images uploaded', data.messages.toLocaleString()],
                ['custom emojis', data.emoji.toLocaleString()],
                ['storage used', formatBytes(data.totalSize)],
              ];

              document.querySelector('#admin-stats-grid').innerHTML = rows
                .map(([label, value]) =>
                  `<div class="admin-stat-row">
                    <span class="admin-stat-label">${label}</span>
                    <span class="admin-stat-value">${value}</span>
                  </div>`
                )
                .join('');
            } catch (e) {
              document.querySelector('#admin-stats-grid').innerHTML =
                '<div class="admin-loading">failed to load stats</div>'
            }
          }

          socket.on('usercount', (count) => {
            document.querySelector('#admin-online-count').textContent = count;
          })

          loadStats()

          document.querySelector('#owner-mutechat-btn').addEventListener('click', async () => {
            try {
              const res = await fetch ('/admin/mutechat', {
                method: "POST",
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session }),
                });
              const data = await res.json();
              if (data.success) {
                chatMutedb = data.muted;
                // alert() is a placeholder like last time
                showToast(data.muted ? 'chat muted' : 'chat unmuted')
              } else {
                showToast('failed to toggle mute')
              }
            } catch (e) {
              showToast('error: ' + e.message);
            }
          });

          document.querySelector('#owner-maintenance-btn').addEventListener('click', async () => {
            const reason = await showModal({
              message: "maintenance reason (leave blank to turn off)",
              withInput: true,
              defaultValue: ''
            })
            if (reason === null) return
            try {
              const res = await fetch('/admin/maintenance', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session, reason })
              });
              const data = await res.json();
              if (data.success) {
                showToast(data.maintenance ? `maintenance on: ${data.reason}` : `maintenance disabled`)
              } else {
                showToast('failed to toggle maintenance')
              }
            } catch (e) {
              showToast('error: ' + e.message)
            }
          });

          // this only clears main for now, will implement like a channel picker/switcher eventually

          document.querySelector('#owner-clear-btn').addEventListener('click', async () => {
            const confirmed = await showModal({
              message: 'clear main channel chat history?'
            });
            if (!confirmed) return
            try {
              const res = await fetch('/admin/clear', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ session, channel: 'main' })
              });
              const data = await res.json();
              if (data.success) {
                showToast('chat cleared')
              } else {
                showToast('failed to clear chat')
              }
            } catch (e) {
              showToast('error: ' + e.message)
            }
          });

          document.querySelector('#owner-refresh-version-btn').addEventListener('click', async () => {
            try {
              showToast('refreshing version status...', 'info')
              await fetch('/version?refresh=1')
              showToast('version status refreshed', 'success')
            } catch (e) {
              showToast('failed to refresh version', 'error')
            }
          })

          // no choice but to implement this as much as i hate browser prompts, if something calls commandError and there's no handler for it it could probably crash the entire site and i don't want that
          socket.on('commandError', (msg) => showToast(msg))
        </script>

        <div id="modal-overlay" style="display: none;">
            <div id="modal-box">
                <p id="modal-message"></p>
                <input type="text" id="modal-input" style="display: none;"/>
                <div id="modal-actions">
                    <button type="button" id="modal-cancel">cancel</button>
                    <button type="button" id="modal-confirm">confirm</button>
                </div>
            </div>
        </div>
        <div id="toast-container"></div>
    </body>
</html>
