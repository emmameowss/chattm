<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>chat™ admin</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    </head>
    <body class="admin-page">
        <h1>chat™</h1>
        <nav class="admin-nav">
          <div class="admin-nav-tabs">
            <a href="/admin" class="active">home</a>
            <a href="/admin/users">users</a>
            <a id='emoji'>emoji</a>
            <a id='logs'>logs</a>
          </div>
          <a href="/" class="admin-nav-back">← back to chat™</a>
        </nav>
        <div id="admin-actions-content">
            <div class="admin-sections-grid">
                <div class="admin-section">
                    <h3 class="admin-section-title">quick actions</h3>
                    <div class="admin-actions-buttons">
                        <button id="owner-mutechat-btn"><i class="ti ti-microphone-off"></i> toggle chat mute</button>
                        <button id="owner-maintenance-btn"><i class="ti ti-tool"></i> toggle maintenance</button>
                        <button id="owner-clear-btn"><i class="ti ti-trash"></i> clear channel history</button>
                        <button id="owner-refresh-version-btn"><i class="ti ti-refresh"></i> refresh version status</button>
                    </div>
                </div>

                <div class="admin-section">
                    <h3 class="admin-section-title">status</h3>
                    <div class="admin-status-grid">
                        <div class="admin-status-item" id="chat-mute-status">
                            <div class="admin-status-indicator"></div>
                            <div class="admin-status-info">
                                <span class="admin-status-label">chat mute</span>
                                <span class="admin-status-value">-</span>
                            </div>
                        </div>
                        <div class="admin-status-item" id="maintenance-status">
                            <div class="admin-status-indicator"></div>
                            <div class="admin-status-info">
                                <span class="admin-status-label">maintenance mode</span>
                                <span class="admin-status-value">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="admin-section">
                    <h3 class="admin-section-title">server stats</h3>
                    <div id="admin-stats-grid" class="admin-stats-grid">
                        <div class="admin-loading">loading...</div>
                    </div>
                </div>

                <div class="admin-section">
                    <h3 class="admin-section-title">online now</h3>
                    <div class="admin-online-users">
                        <div class="admin-online-count">
                            <span class="count" id="admin-online-count">-</span>
                            <span>users online</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-section">
                <h3 class="admin-section-title">quick links</h3>
                <div class="admin-quick-links">
                    <a href="https://dashboard.clerk.com" target="_blank" rel="noopener noreferrer" class="admin-link">
                        <i class="ti ti-key"></i>
                        <span>clerk dashboard</span>
                    </a>
                    <a href="https://dash.cloudflare.com" target="_blank" rel="noopener noreferrer" class="admin-link">
                        <i class="ti ti-cloud"></i>
                        <span>cloudflare dashboard</span>
                    </a>
                    <a href="https://github.com/emmameowss/chattm" target="_blank" rel="noopener noreferrer" class="admin-link">
                        <i class="ti ti-brand-github"></i>
                        <span>github repo</span>
                    </a>
                </div>
            </div>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/admin.js"></script>

        <div id="modal-overlay" style="display: none;">
            <div id="modal-box">
                <p id="modal-message"></p>
                <input type="text" id="modal-input" style="display: none;"/>
                <div id="modal-actions">
                    <button type="button" id="modal-cancel">cancel</button>
                    <button type="button" id="modal-confirm">confirm</button>
                </div>
            </div>
        </div>
        <div id="toast-container"></div>
    </body>
</html>
