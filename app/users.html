<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>chat™ admin | users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin-ui.js" defer></script>
  </head>
  <body class="admin-page admin-users-page">
    <a class="admin-skip-link" href="#admin-main">skip to content</a>
    <aside class="admin-shell-sidebar">
      <div class="admin-brand"><h1>chat™</h1></div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-tabs">
          <a href="/admin"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>overview</a>
          <a href="/admin/users" class="active" aria-current="page"><i class="ti ti-users" aria-hidden="true"></i>users</a>
          <a href="/admin/emoji"><i class="ti ti-mood-smile" aria-hidden="true"></i>emoji</a>
          <button id="logs" type="button" title="Action logs are not yet implemented"><i class="ti ti-list-details" aria-hidden="true"></i>logs<span class="admin-nav-soon">soon</span></button>
        </div>
        <a href="/" class="admin-nav-back"><i class="ti ti-arrow-left" aria-hidden="true"></i>back to chat™</a>
      </nav>
    </aside>
    <main id="admin-main" class="admin-main" tabindex="-1">
      <header class="admin-page-header admin-users-page-header">
        <div><h2>users</h2><p>user details, roles, and moderation.</p></div>
        <button type="button" id="admin-users-refresh"><i class="ti ti-refresh" aria-hidden="true"></i> refresh</button>
      </header>
      <section class="admin-section admin-users-directory" aria-label="User directory">
        <div class="admin-users-views" role="group" aria-label="Filter users">
          <button type="button" data-user-view="all" aria-pressed="true">all users <span data-user-count="all">—</span></button>
          <button type="button" data-user-view="online" aria-pressed="false">online <span data-user-count="online">—</span></button>
          <button type="button" data-user-view="muted" aria-pressed="false">muted <span data-user-count="muted">—</span></button>
          <button type="button" data-user-view="banned" aria-pressed="false">banned <span data-user-count="banned">—</span></button>
          <button type="button" data-user-view="hidden" aria-pressed="false">hidden <span data-user-count="hidden">—</span></button>
        </div>
        <div id="admin-users-toolbar" class="admin-users-toolbar">
          <label class="admin-users-search" for="admin-users-search"><span class="admin-visually-hidden">search username or email</span><i class="ti ti-search" aria-hidden="true"></i><input id="admin-users-search" type="search" placeholder="search username or email" autocomplete="off"></label>
          <label class="admin-users-filter" for="admin-users-role"><span>role</span><select id="admin-users-role"><option value="all">all roles</option><option value="user">user</option><option value="mod">mod</option><option value="admin">admin</option><option value="owner">owner</option></select></label>
          <label class="admin-users-filter" for="admin-users-type"><span>account type</span><select id="admin-users-type"><option value="all">all types</option><option value="registered">registered</option><option value="guest">guest</option></select></label>
          <label class="admin-users-filter" for="admin-users-sort"><span>sort</span><select id="admin-users-sort"><option value="online">online first</option><option value="asc">username a–z</option><option value="desc">username z–a</option></select></label>
        </div>
        <div id="admin-users-state" class="admin-users-state" role="status" aria-live="polite">loading users…</div>
        <div class="admin-users-table-wrap" id="admin-users-table-wrap" hidden>
          <table class="admin-users-table">
            <thead><tr><th scope="col">user</th><th scope="col">role</th><th scope="col">presence</th><th scope="col">moderation</th><th scope="col"><span class="admin-visually-hidden">details</span></th></tr></thead>
            <tbody id="admin-users-list"></tbody>
          </table>
        </div>
        <footer class="admin-users-directory-footer"><p id="admin-users-results" role="status" aria-live="polite"></p><nav id="admin-users-pagination" class="admin-users-pagination" aria-label="User directory pages" hidden><button type="button" id="admin-users-prev">previous</button><span id="admin-users-page" aria-live="polite"></span><button type="button" id="admin-users-next">next</button></nav><button type="button" id="admin-users-reset" hidden>clear filters</button></footer>
      </section>
    </main>
    <div id="admin-user-drawer-backdrop" class="admin-user-drawer-backdrop" hidden></div>
    <dialog id="admin-user-drawer" class="admin-user-drawer" aria-modal="true" aria-labelledby="admin-user-drawer-title">
      <header class="admin-user-drawer-header"><h3 id="admin-user-drawer-title">user details</h3><button type="button" id="admin-user-drawer-close" aria-label="close user details"><i class="ti ti-x" aria-hidden="true"></i></button></header>
      <div id="admin-users-detail" class="admin-users-detail"></div>
    </dialog>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/users.js"></script>
    <div id="modal-overlay" style="display: none;">
      <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-message">
        <p id="modal-message"></p>
        <input type="text" id="modal-input" aria-labelledby="modal-message" style="display: none;">
        <select id="modal-select" aria-labelledby="modal-message" style="display: none;"></select>
        <div id="modal-actions"><button type="button" id="modal-cancel">cancel</button><button type="button" id="modal-confirm">confirm</button></div>
      </div>
    </div>
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>
