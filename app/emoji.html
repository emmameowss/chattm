<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>chat™ admin | emoji</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin-ui.js" defer></script>
  </head>
  <body class="admin-page admin-users-page admin-emoji-page">
    <a class="admin-skip-link" href="#admin-main">skip to content</a>
    <aside class="admin-shell-sidebar">
      <div class="admin-brand"><h1>chat™</h1></div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-tabs">
          <a href="/admin"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>overview</a>
          <a href="/admin/users"><i class="ti ti-users" aria-hidden="true"></i>users</a>
          <a href="/admin/emoji" class="active" aria-current="page"><i class="ti ti-mood-smile" aria-hidden="true"></i>emoji</a>
          <a href="/admin/logs"><i class="ti ti-list-details" aria-hidden="true"></i>logs</a>
        </div>
        <a href="/" class="admin-nav-back"><i class="ti ti-arrow-left" aria-hidden="true"></i>back to chat™</a>
      </nav>
    </aside>
    <main id="admin-main" class="admin-main" tabindex="-1">
      <header class="admin-page-header admin-users-page-header">
        <div><h2>emoji</h2><p>add, replace, and manage custom emoji.</p></div>
        <div class="admin-emoji-header-actions">
          <button type="button" id="admin-emoji-refresh"><i class="ti ti-refresh" aria-hidden="true"></i> refresh</button>
          <button type="button" id="admin-emoji-add" class="admin-emoji-primary"><i class="ti ti-plus" aria-hidden="true"></i> add emoji</button>
        </div>
      </header>
      <section class="admin-section admin-users-directory" aria-label="Emoji directory">
        <div class="admin-users-views"><span id="admin-emoji-count">custom emoji</span></div>
        <div class="admin-users-toolbar admin-emoji-toolbar">
          <label class="admin-users-search" for="admin-emoji-search"><span class="admin-visually-hidden">search shortcode</span><i class="ti ti-search" aria-hidden="true"></i><input id="admin-emoji-search" type="search" placeholder="search shortcode" autocomplete="off"></label>
          <label class="admin-users-filter" for="admin-emoji-sort"><span>sort</span><select id="admin-emoji-sort"><option value="asc">shortcode a–z</option><option value="desc">shortcode z–a</option></select></label>
        </div>
        <div id="admin-emoji-state" class="admin-users-state" role="status" aria-live="polite">loading emoji…</div>
        <div id="admin-emoji-table-wrap" class="admin-users-table-wrap" hidden>
          <table class="admin-users-table admin-emoji-table">
            <thead><tr><th scope="col">emoji / shortcode</th><th scope="col"><span class="admin-visually-hidden">details</span></th></tr></thead>
            <tbody id="admin-emoji-list"></tbody>
          </table>
        </div>
        <footer class="admin-users-directory-footer"><p id="admin-emoji-results" role="status" aria-live="polite"></p><button type="button" id="admin-emoji-reset" hidden>clear filters</button></footer>
      </section>
    </main>
    <div id="admin-emoji-drawer-backdrop" class="admin-user-drawer-backdrop" hidden></div>
    <dialog id="admin-emoji-drawer" class="admin-user-drawer" aria-modal="true" aria-labelledby="admin-emoji-drawer-title">
      <header class="admin-user-drawer-header"><h3 id="admin-emoji-drawer-title">emoji details</h3><button type="button" id="admin-emoji-drawer-close" aria-label="close emoji details"><i class="ti ti-x" aria-hidden="true"></i></button></header>
      <div id="admin-emoji-detail" class="admin-users-detail"></div>
    </dialog>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/emoji.js"></script>
    <div id="modal-overlay" style="display: none;">
      <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-message">
        <img id="modal-emoji-preview" alt="" hidden>
        <p id="modal-message"></p>
        <input type="text" id="modal-input" aria-labelledby="modal-message" style="display: none;">

        <div id="modal-actions"><button type="button" id="modal-cancel">cancel</button><button type="button" id="modal-confirm">confirm</button></div>
      </div>
    </div>
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>
