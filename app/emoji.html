<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>chat™ admin | emoji</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="admin-page">
        <h1>chat™</h1>
        <nav class="admin-nav">
          <div class="admin-nav-tabs">
            <a href="/admin">home</a>
            <a href="/admin/users">users</a>
            <a href="/admin/emoji" class="active">emoji</a>
          </div>
          <a href="/" class="admin-nav-back">← back to chat™</a>
        </nav>
        <div id="admin-emoji-list"></div>
        <script>
          const session = localStorage.getItem('session')
          if (!session) window.location.href = "/"

          async function loadPending() {
            const res = await fetch(`/pending-emojis?session=${encodeURIComponent(session)}`)
            const items = await res.json()
            const list = document.querySelector('#admin-emoji-list')
            list.innerHTML = ''
            for (const item of items) {
              const row = document.createElement('row')
              row.innerHTML = `
                <img src="${item.url}" class="admin-emoji-thumb">
                <div class="admin-emoji-info">
                  <span class="admin-emoji-shortcode">${item.shortcode}</span>
                  <span class="admin-emoji-submitter">by ${item.submitter_username || item.submitter_email}</span>
                </div>
              `
              if ((item.status || "pending") === 'pending') {
                const actions = document.createElement("div")
                actions.className = "admin-emoji-detail-actions"
                const accept = document.createElement("button")
                accept.textContent = 'accept'
                accept.addEventListener('click', () => review(item.id, 'accept'))
                const deny = document.createElement('button')
                deny.textContent = 'deny'
                deny.addEventListener('click', () => review(item.id, 'deny'))
                actions.append(accept,deny)
                row.appendChild(actions)
              }
              list.appendChild(row)
            }
          }

          async function review(id,action) {
            const reason = prompt('reason: (optional)') || null
            await fetch(`/admin/emoji/${action}`, {
              method: "POST",
              headers: { "content-type": 'application/json' },
              body: JSON.stringify({ id, session, reason })
            })
            loadPending()
          }
          loadPending()
        </script>
    </body>
</html>
