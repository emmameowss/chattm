<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>chat™ admin | emoji</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin-ui.js" defer></script>
  </head>
  <body class="admin-page">
    <a class="admin-skip-link" href="#admin-main">skip to content</a>
    <aside class="admin-shell-sidebar">
      <div class="admin-brand"><h1>chat™</h1><span class="admin-brand-caption">administration</span></div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-tabs">
          <a href="/admin"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>overview</a>
          <a href="/admin/users"><i class="ti ti-users" aria-hidden="true"></i>users</a>
          <a href="/admin/emoji" class="active" aria-current="page"><i class="ti ti-mood-smile" aria-hidden="true"></i>emoji</a>
          <button id="logs" type="button" title="Action logs are not yet implemented"><i class="ti ti-list-details" aria-hidden="true"></i>logs<span class="admin-nav-soon">soon</span></button>
        </div>
        <a href="/" class="admin-nav-back"><i class="ti ti-arrow-left" aria-hidden="true"></i>back to chat™</a>
      </nav>
      <div class="admin-sidebar-footer"><span class="admin-sidebar-mark">™</span><span>a little space for everyone.</span></div>
    </aside>
    <main id="admin-main" class="admin-main" tabindex="-1">
      <header class="admin-page-header">
        <div class="admin-breadcrumb">workspace <span>/</span> emoji</div>
        <h2>emoji</h2>
        <p>view and manage custom emoji.</p>
      </header>
      <div class="admin-workspace-label"><span>emoji library</span><span>select an item to view details</span></div>
<div class="admin-users-container">
      <div class="admin-users-sidebar" role="region" aria-label="Emoji library" id="admin-emoji-sidebar">

      </div>
      <div class="admin-users-detail" role="region" aria-label="Emoji details" id="admin-emoji-detail">
        <div class='admin-users-detail-empty'>
          <i class="ti ti-mood-smile" aria-hidden="true"></i><strong>select an emoji</strong><span>preview it, copy its url, or delete it.</span>
        </div>
      </div>
    </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/emoji.js"></script>
    <div id="modal-overlay" style="display: none;">
      <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-message">
        <p id="modal-message"></p>
        <input type="text" id="modal-input" aria-labelledby="modal-message" style="display: none;">

        <div id="modal-actions"><button type="button" id="modal-cancel">cancel</button><button type="button" id="modal-confirm">confirm</button></div>
      </div>
    </div>
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>
